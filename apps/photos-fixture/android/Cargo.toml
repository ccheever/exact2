# @exact/photos's fixture on Android's Canvas host (LLP 1133.019 stage 3):
# a library with no GPU module, so the photos implementation can be
# driven on an emulator. Off Android the library is empty.
[package]
name = "photos-fixture-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "@exact/photos's fixture on Android's Canvas host"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_os = "android")'.dependencies]
photos-fixture-data = { path = "../data" }
exact-data-host = { path = "../../../data/host" }
exact-linux = { path = "../../../host/linux" }

[build-dependencies]
photos-fixture-data = { path = "../data" }
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
