[package]
name = "android-core-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Android core example's shared Contract on the web oracle"
publish = false
build = "build.rs"

[lib]
name = "android_core_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
android-core-data = { path = "../data" }
