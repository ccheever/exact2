[package]
name = "shared-elements-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Elements on Apple platforms: the host's C exports over its baked plan"
publish = false
build = "build.rs"

[lib]
name = "shared_elements_apple"
crate-type = ["staticlib", "rlib"]

[dependencies]
exact-logic = { path = "../../../logic" }
exact-apple = { path = "../../../host/apple" }
shared-elements-data = { path = "../data" }

[build-dependencies]
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
shared-elements-data = { path = "../data" }
