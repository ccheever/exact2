[package]
name = "interaction-gallery-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Interaction gallery example on Apple platforms: the host's C exports over its data source and baked plan"
publish = false
build = "build.rs"

[lib]
name = "interaction_gallery_apple"
crate-type = ["rlib"]

[dependencies]
exact-logic = { path = "../../../logic" }
exact-apple = { path = "../../../host/apple" }
interaction-gallery-data = { path = "../data" }

[build-dependencies]
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
interaction-gallery-data = { path = "../data" }
