# Variable Type on Android's Canvas host (LLP 1019 §13): the library the
# reader (host/android) loads as libexactcanvas.so, with the baked plan and
# its empty TypeScript data module. Off Android the library is empty.
[package]
name = "variable-type-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Variable Type on Android's Canvas host: the library the reader loads"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_os = "android")'.dependencies]
exact-logic = { path = "../../../logic" }
exact-linux = { path = "../../../host/linux" }
exact-js = { path = "../../../js" }

[build-dependencies]
exact-js-bake = { path = "../../../js/bake" }
exact-plan = { path = "../../../plan" }
contract = { path = "../../../contract/cli" }
