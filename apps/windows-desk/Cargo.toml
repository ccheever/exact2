[package]
name = "windows-desk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
exact-kernel = { path = "../../kernel" }
exact-plan = { path = "../../plan" }
exact-runner = { path = "../../runner" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"] }

[build-dependencies]
contract = { path = "../../contract/cli" }
