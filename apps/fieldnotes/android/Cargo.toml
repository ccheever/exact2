# Fieldnotes on Android's Canvas host (llp/0001 §5): one library with the
# runner, the kernel, the baked plan, the notes' TypeScript as Hermes
# bytecode and the Rust backup source (written by build.rs, never committed),
# which the reader (host/android) loads as libexactcanvas.so. Its share
# target (LLP 1133.024 D5) is driven here. Off Android the library is empty.
[package]
name = "fieldnotes-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fieldnotes on Android's Canvas host: the library the reader loads"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_os = "android")'.dependencies]
fieldnotes-data = { path = "../data" }
exact-data-host = { path = "../../../data/host" }
exact-logic = { path = "../../../logic" }
exact-linux = { path = "../../../host/linux" }
exact-js = { path = "../../../js" }

[build-dependencies]
fieldnotes-data = { path = "../data" }
exact-js-bake = { path = "../../../js/bake" }
exact-plan = { path = "../../../plan" }
contract = { path = "../../../contract/cli" }
