[package]
name = "spark-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spark on the web: one wasm with the runner, the kernel, and the baked plan"
publish = false
build = "build.rs"

[lib]
name = "spark_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
exact-logic = { path = "../../../logic" }
exact-web = { path = "../../../host/web" }
exact-web-capabilities = { path = "../../../host/web-capabilities" }
spark-data = { path = "../data" }

[build-dependencies]
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
spark-data = { path = "../data" }
