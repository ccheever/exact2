[package]
name = "reflow-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reflow on Apple platforms: the host's C exports over its data source and baked plan"
publish = false
build = "build.rs"

[lib]
name = "reflow_apple"
crate-type = ["staticlib", "rlib"]

[dependencies]
exact-logic = { path = "../../../logic" }
exact-apple = { path = "../../../host/apple" }
reflow-data = { path = "../data" }

[build-dependencies]
contract = { path = "../../../contract/cli" }
reflow-data = { path = "../data" }
