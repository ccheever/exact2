# The LLP reader in a terminal: the terminal host over the
# reader's own data module, full screen.
[package]
name = "llp-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The LLP reader in the terminal"
publish = false

[[bin]]
name = "llp"
path = "src/main.rs"

[dependencies]
exact-terminal = { path = "../../../host/terminal" }
llp-data = { path = "../data" }

[build-dependencies]
contract = { path = "../../../contract/cli" }
