[package]
name = "orientation-fixture-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orientation Fixture on the web: one wasm with the runner, the kernel, and the baked plan"
publish = false
build = "build.rs"

[lib]
name = "orientation_fixture_web"
crate-type = ["cdylib", "rlib"]
test = false
bench = false

[[bin]]
name = "orientation-fixture-dev"
path = "src/bin/orientation-fixture-dev.rs"
test = false
bench = false

[dependencies]
exact-logic = { path = "../../../logic" }
exact-web = { path = "../../../host/web" }
exact-web-capabilities = { path = "../../../host/web-capabilities" }
orientation-fixture-data = { path = "../data" }

[build-dependencies]
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
orientation-fixture-data = { path = "../data" }
