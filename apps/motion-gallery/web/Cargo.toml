[package]
name = "motion-gallery-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Motion Gallery on the web: one wasm with the runner, the kernel, and the baked plan"
publish = false
build = "build.rs"

[lib]
name = "motion_gallery_web"
crate-type = ["cdylib", "rlib"]
test = false
bench = false

[[bin]]
name = "motion-gallery-dev"
path = "src/bin/motion-gallery-dev.rs"
test = false
bench = false

[dependencies]
exact-logic = { path = "../../../logic" }
exact-web = { path = "../../../host/web" }
exact-web-capabilities = { path = "../../../host/web-capabilities" }
motion-gallery-data = { path = "../data" }

[build-dependencies]
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
motion-gallery-data = { path = "../data" }
