[package]
name = "ocho-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ocho's data source: the workspace model (a port of the GPUI desktop's), answering the view from memory; the app's module runs the fleet feed, the fleet CLI and the terminals"
publish = false

[dependencies]
exact-plan = { path = "../../../plan" }
exact-runner = { path = "../../../runner" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
