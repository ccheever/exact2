# The photo editor on Linux: one executable with the runner, the kernel, the
# data crate, the baked plan (written by build.rs, never committed), and the
# host's painter.
[package]
name = "photo-editor-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The photo editor on the Linux host: the app's executable"
publish = false
build = "build.rs"

[[bin]]
name = "photo-editor-linux"
path = "src/main.rs"

[dependencies]
exact-logic = { path = "../../../logic" }
photo-editor-data = { path = "../data" }
exact-linux = { path = "../../../host/linux" }


[build-dependencies]
photo-editor-data = { path = "../data" }
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }

