# The photo editor on the Linux host: one executable with the runner, the
# kernel, the baked plan and its TypeScript data module.
[package]
name = "photo-editor-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "photo-editor-linux"
path = "src/main.rs"
test = false
bench = false

[dependencies]
exact-logic = { path = "../../../logic" }
exact-linux = { path = "../../../host/linux" }
exact-js = { path = "../../../js" }

[build-dependencies]
exact-js-bake = { path = "../../../js/bake" }
