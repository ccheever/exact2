# The Caltrain app on Android's Canvas host (LLP 1076 §3.3): one library with
# the runner, the kernel, the data crate, the baked plan (written by build.rs,
# never committed) and the host's JNI, which the reader (host/android) loads as
# libexactcanvas.so. Off Android the library is empty: the Canvas host is
# Android's (`exact_linux::canvas`).
[package]
name = "caltrain-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Caltrain on Android's Canvas host: the library the reader loads"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_os = "android")'.dependencies]
caltrain-data = { path = "../data" }
exact-linux = { path = "../../../host/linux" }

[build-dependencies]
caltrain-data = { path = "../data" }
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
