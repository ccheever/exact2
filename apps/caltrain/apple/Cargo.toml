# The Caltrain app for Apple platforms: one static library with the runner,
# the kernel, the data crate, and the baked plan (written by build.rs, never
# committed), exporting the C ABI in host/apple/include/exact.h.
[package]
name = "caltrain-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Caltrain on the Apple host: the app's static library"
publish = false
build = "build.rs"

[lib]
name = "caltrain_apple"
crate-type = ["rlib"]

[dependencies]
exact-logic = { path = "../../../logic" }
caltrain-data = { path = "../data" }
exact-apple = { path = "../../../host/apple" }

exact-apple-update = { path = "../../../host/apple-update" }

[build-dependencies]
caltrain-data = { path = "../data" }
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
