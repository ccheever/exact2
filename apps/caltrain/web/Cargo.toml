# The Caltrain app for the web: one wasm with the runner, the kernel, the
# data crate, and the baked plan (written by build.rs, never committed).
[package]
name = "caltrain-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Caltrain on the web host: the app's wasm"
publish = false
build = "build.rs"
default-run = "caltrain-dev"

[lib]
name = "caltrain_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
exact-logic = { path = "../../../logic" }
caltrain = { path = ".." }
caltrain-data = { path = "../data" }
contract = { path = "../../../contract/cli" }
exact-kernel = { path = "../../../kernel" }
exact-plan = { path = "../../../plan" }
exact-runner = { path = "../../../runner" }
exact-web = { path = "../../../host/web" }

[[bin]]
name = "metrics"
path = "src/bin/metrics.rs"

[build-dependencies]
caltrain-data = { path = "../data" }
contract = { path = "../../../contract/cli" }
