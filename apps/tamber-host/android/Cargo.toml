# The Tamber binding host on Android's Canvas host (LLP 1121 D12): one library with
# the runner, the kernel, the data crate, the baked plan (written by build.rs,
# never committed) and the host's JNI, which the reader (host/android) loads as
# libexactcanvas.so. Off Android the library is empty: the Canvas host is
# Android's (`exact_linux::canvas`).
[package]
name = "tamber-host-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Tamber binding host on Android's Canvas host: the library the reader loads"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_os = "android")'.dependencies]
tamber-host-data = { path = "../data" }
exact-linux = { path = "../../../host/linux" }

[build-dependencies]
tamber-host-data = { path = "../data" }
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
