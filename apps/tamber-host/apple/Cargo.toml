[package]
name = "tamber-host-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Tamber binding host on Apple platforms: a native module drawing with the design"
publish = false
build = "build.rs"

[lib]
name = "tamber_host_apple"
