# The Canvas gallery on the web (LLP 1056 §4): one wasm with the runner, the
# kernel and the baked plan; its TypeScript module runs in the page's realm.
[package]
name = "canvas-gallery-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
exact-logic = { path = "../../../logic" }
exact-web = { path = "../../../host/web" }
exact-web-capabilities = { path = "../../../host/web-capabilities" }
exact-js-web = { path = "../../../js/web" }

[build-dependencies]
exact-js-bake = { path = "../../../js/bake" }
