# The Rust binding's fixture on Android's Canvas host (LLP 1133.002 stage 4):
# a library with no GPU module, so a module's Android implementation can be
# driven on an emulator. Off Android the library is empty.
[package]
name = "module-fixture-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Rust binding's fixture on Android's Canvas host"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_os = "android")'.dependencies]
module-fixture-data = { path = "../data" }
exact-linux = { path = "../../../host/linux" }

[build-dependencies]
module-fixture-data = { path = "../data" }
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
