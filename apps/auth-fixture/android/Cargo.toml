# The auth fixture on Android's Canvas host (LLP 1076 §3.3; LLP 1133.028 stage 3):
# one library with the runner, the kernel, the baked plan, the app's
# TypeScript data module as Hermes bytecode (both written by build.rs, never
# committed), the lean Hermes VM that runs it, and the host's JNI, which the
# reader (host/android) loads as libexactcanvas.so. Off Android the library is
# empty: the Canvas host is Android's (`exact_linux::canvas`). The recorder's is the
# one it copies.
[package]
name = "auth-fixture-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The auth fixture on Android's Canvas host: the library the reader loads"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_os = "android")'.dependencies]
exact-logic = { path = "../../../logic" }
exact-linux = { path = "../../../host/linux" }
exact-js = { path = "../../../js" }

[build-dependencies]
exact-js-bake = { path = "../../../js/bake" }
exact-plan = { path = "../../../plan" }
contract = { path = "../../../contract/cli" }
