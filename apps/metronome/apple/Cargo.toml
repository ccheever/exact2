[package]
name = "metronome-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Metronome on Apple platforms: the host's C exports over its baked plan"
publish = false
build = "build.rs"

[lib]
name = "metronome_apple"
crate-type = ["staticlib", "rlib"]
test = false
bench = false

[dependencies]
exact-logic = { path = "../../../logic" }
exact-apple = { path = "../../../host/apple" }
metronome-data = { path = "../data" }

[build-dependencies]
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
metronome-data = { path = "../data" }
