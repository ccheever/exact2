[package]
name = "video-player-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Video Player on the web: one wasm with the runner, the kernel, and the baked plan"
publish = false
build = "build.rs"

[lib]
name = "video_player_web"
crate-type = ["cdylib", "rlib"]
test = false
bench = false

[[bin]]
name = "video-player-dev"
path = "src/bin/video-player-dev.rs"
test = false
bench = false

[dependencies]
exact-logic = { path = "../../../logic" }
exact-web = { path = "../../../host/web" }
exact-web-capabilities = { path = "../../../host/web-capabilities" }
video-player-data = { path = "../data" }

[build-dependencies]
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
video-player-data = { path = "../data" }
