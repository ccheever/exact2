name = "contract-semantics"
defaultTargets = ["Contract", "Apps"]

# The library is compiled to native code so a generated program's `main`,
# run with `lean --run`, calls the interpreter natively.
[[lean_lib]]
name = "Contract"
precompileModules = true
# The roster's match (`Contract.Eval.stdlib`) has outgrown the default
# budget for the equations and splitter Lean makes for it where a proof
# unfolds it; those are made outside any `set_option … in`, so the budget is
# the library's.
leanOptions = { maxHeartbeats = 400000 }

# Real apps' embeddings (`contract lean`, kept current by `difftest apps`)
# and the invariants proved of them.
[[lean_lib]]
name = "Apps"
globs = ["Apps.+"]
