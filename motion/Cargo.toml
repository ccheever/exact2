# The motion domain: one Rust evaluator crate — the SharedValue plane,
# closed-form drivers, the fixed-step virtual clock, the continuous-input
# path (recognizers, arena, gesture graph), and interactive navigation.
#
# @ref RFC 0492 (motion refresh program) / LLP 0099 (motion) / RFC 0100
# (interactive navigation transitions).
#
# The dependency closure is `libm` and nothing else: no `libc`, no
# `windows-sys`, no host crate. The crate builds for wasm32-unknown-unknown.
[package]
name = "exact-motion"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Motion evaluator: shared values, closed-form drivers, a virtual clock, gestures, and interactive navigation"
publish = false

[lib]
name = "exact_motion"
crate-type = ["rlib"]

[dependencies]
libm = "0.2"
