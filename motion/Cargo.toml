# The motion evaluator: CSS `transition` semantics over the four compositor
# properties, one spring, and a seekable clock.
#
# @ref LLP 1002 (motion v1 decision) / LLP 1003 (motion v1 spec).
#
# The dependency closure is `libm` and nothing else: no host crate, no kernel.
# The kernel depends on this crate for the `transition` style row's type; this
# crate depends on nothing. It builds for wasm32-unknown-unknown.
[package]
name = "exact-motion"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Motion evaluator: CSS transitions, a spring, and a seekable clock"
publish = false

[lib]
name = "exact_motion"
crate-type = ["rlib"]

[dependencies]
libm = "0.2"
