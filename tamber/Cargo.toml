# Tamber: the `.tamber` grammar, its checker and the build's one evaluator.
# A leaf below the Contract compiler, the `tamber` verbs
# and the design tool's wasm; a shipped build never carries it.
[package]
name = "exact-tamber"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tamber designs: parse, check and fold to the IR"
publish = false

[lib]
name = "exact_tamber"
crate-type = ["rlib"]

[dependencies]
exact-color = { path = "../color" }
exact-num = { path = "../num" }
# A motion token is checked as its transition reads it.
exact-motion = { path = "../motion" }
# The DTCG importer reads JSON.
serde_json = "1.0"
# A `.pen` file's axes and variables in the order written.
serde = "1.0"

[dev-dependencies]
exact-kernel = { path = "../kernel" }
# The scale tests time the thread's own CPU, which load elsewhere leaves be.
libc = "0.2"
