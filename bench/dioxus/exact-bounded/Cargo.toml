# The heavy list (bench/heavy-list/SPEC.md) on exact2 with a bounded answer (LLP 1027.004), consumed by path
# from the checkout this directory is in. `data/` answers a window of the feed, reactions and live mode;
# `apple/` is the static library the Apple host links; `web/` is the web build's crate. Its own [workspace],
# so the root workspace never adopts it. Cargo.lock is not committed: ../prepare.sh copies the checkout's.
[workspace]
members = ["data", "apple", "web"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# exact2's vendored patches, the root Cargo.toml's [patch.crates-io] (scripts/app.mjs refuses a
# workspace whose patches differ from the checkout's).
[patch.crates-io]
taffy = { path = "../../../vendor/taffy" }
parley = { path = "../../../vendor/parley" }
fontique = { path = "../../../vendor/fontique" }
wgpu-hal = { path = "../../../vendor/wgpu-hal" }

# exact2's release profile. No [profile.apple-dev] on purpose: build.mjs then
# builds the app library with `release` (thin LTO, one codegen unit).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
strip = false

[profile.dev]
opt-level = 0
debug = true
