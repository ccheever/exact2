# The Extra Heavy feed on the web host (the web pair, ../../web): the web build's crate — the
# runner, the kernel, the data crate and the baked plan (as exact2's apps/caltrain/web).
[package]
name = "exact-xheavy-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extra Heavy feed on the web host: the app's wasm"
publish = false
build = "build.rs"

[lib]
name = "exact_xheavy_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
exact-xheavy-data = { path = "../data" }
exact-logic = { path = "../../../../logic" }
exact-web = { path = "../../../../host/web" }
exact-web-capabilities = { path = "../../../../host/web-capabilities" }
exact-runner = { path = "../../../../runner" }
exact-plan = { path = "../../../../plan" }

[build-dependencies]
exact-xheavy-data = { path = "../data" }
contract = { path = "../../../../contract/cli" }
exact-bake = { path = "../../../../bake" }
