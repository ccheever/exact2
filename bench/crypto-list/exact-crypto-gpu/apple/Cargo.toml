[package]
name = "exact-crypto-gpu-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Crypto list (GPU) on the Apple host: the app's static library"
publish = false
build = "build.rs"

[lib]
name = "exact_crypto_gpu_apple"
crate-type = ["staticlib", "rlib"]

[dependencies]
exact-crypto-gpu-data = { path = "../data" }
exact-apple = { path = "../../../../host/apple" }

[build-dependencies]
exact-crypto-gpu-data = { path = "../data" }
contract = { path = "../../../../contract/cli" }
exact-bake = { path = "../../../../bake" }

