# The crypto list benchmark (../SPEC.md) on exact2, inline-SVG variant, consumed by path from
# the checkout this directory is in (the shape of bench/heavy-list's exact app). `data/`
# answers the market, the launch config and the live ticks; `apple/` is the static library
# the Apple host links. Its own [workspace], so the root workspace never adopts it.
# Cargo.lock is not committed: ../prepare.sh copies the checkout's lock here, and the first
# build resolves the app's own crates on top of it.
[workspace]
members = ["data", "apple"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# exact2's vendored patches, the root Cargo.toml's [patch.crates-io] (scripts/app.mjs refuses a
# workspace whose patches differ from the checkout's).
[patch.crates-io]
taffy = { path = "../../../vendor/taffy" }
parley = { path = "../../../vendor/parley" }
fontique = { path = "../../../vendor/fontique" }
wgpu-hal = { path = "../../../vendor/wgpu-hal" }

# exact2's release profile. No [profile.apple-dev] on purpose: build.mjs then
# builds the app library with `release` (thin LTO, one codegen unit).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
strip = false

[profile.dev]
opt-level = 0
debug = true
