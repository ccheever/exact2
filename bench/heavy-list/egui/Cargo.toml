[package]
name = "egui-heavy-list"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "egui-heavy-list"
path = "src/main.rs"
test = false
bench = false

[dependencies]
egui = "=0.37.0"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "system_fonts", "wgpu_no_default_features"] }
wgpu = { version = "=30.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12"] }
windows = { version = "0.62.2", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
