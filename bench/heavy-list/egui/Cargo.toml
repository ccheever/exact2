[package]
name = "egui-heavy-list"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "egui-heavy-list"
path = "src/main.rs"
test = false
bench = false

[dependencies]
egui = "=0.37.0"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "system_fonts", "wgpu_no_default_features"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
