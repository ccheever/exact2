# Local workspace keeps generated adapters and build outputs inside this game.
[workspace]
members = ["logic", ".shells/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
exact-game = { path = "../../engine" }
exact-game-bake = { path = "../../bake" }
exact-game-derive = { path = "../../derive" }
exact-game-render = { path = "../../render" }
exact-game-app = { path = "../../app" }
exact-web = { path = "../../../host/web" }
exact-linux = { path = "../../../host/linux" }
exact-apple = { path = "../../../host/apple" }
exact-runner = { path = "../../../runner" }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["HtmlCanvasElement"] }

# The profiles are exact2's (../Cargo.toml): `host/web/build.mjs` builds
# `--profile web`, `host/apple/build.mjs` `--release`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dev]
opt-level = 1
debug = true

# A game's tests run thousands of ticks; the engine under them is optimized even
# in a dev build.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
taffy = { path = "../../../vendor/taffy" }

# Fast surface module rebuilds; dependencies stay optimized, the game links cheaply.
[profile.gpu-dev]
inherits = "dev"
opt-level = 1
debug = false
strip = "debuginfo"
panic = "abort"
lto = false
incremental = true

[profile.gpu-dev.package."*"]
opt-level = 3

# The engine crates are workspace members here, so the wildcard excludes them.
[profile.gpu-dev.package.exact-game]
opt-level = 3
[profile.gpu-dev.package.exact-game-render]
opt-level = 3
