[workspace]
members = ["logic", "web", "apple", "gpu"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# The profiles are exact2's (../Cargo.toml): `host/web/build.mjs` builds
# `--profile web`, `host/apple/build.mjs` `--release`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dev]
opt-level = 1
debug = true

# A game's tests run thousands of ticks; the engine under them is optimized even
# in a dev build.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
taffy = { path = "../../../vendor/taffy" }

# Fast surface module rebuilds; dependencies stay optimized, the game links cheaply.
[profile.gpu-dev]
inherits = "dev"
opt-level = 1
debug = false
strip = "debuginfo"
panic = "abort"
lto = false
incremental = true

[profile.gpu-dev.package."*"]
opt-level = 3
