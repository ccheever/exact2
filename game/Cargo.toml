# The game engine add-on (game/README.md; LLP 1046 §5): its own workspace, absent
# from the root `members`, so exact2's five checks never compile it. It consumes
# exact2 by path, as an app outside the repository does.
[workspace]
members = ["engine", "derive", "bake", "render", "physics", "audio", "app"]
exclude = ["games", "bench"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
exact-game = { path = "engine" }
exact-game-bake = { path = "bake" }
exact-game-derive = { path = "derive" }
exact-game-render = { path = "render" }
exact-game-physics = { path = "physics" }
exact-game-audio = { path = "audio" }
exact-game-app = { path = "app" }
exact-data-host = { path = "../data/host" }
exact-web = { path = "../host/web" }
exact-web-capabilities = { path = "../host/web-capabilities" }
exact-linux = { path = "../host/linux" }
exact-windows = { path = "../host/windows" }
exact-apple = { path = "../host/apple" }
exact-runner = { path = "../runner" }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["HtmlCanvasElement"] }

# The profiles are exact2's (../Cargo.toml): `host/web/build.mjs` builds
# `--profile web`, `host/apple/build.mjs` `--release`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The art bake runs in each GPU crate's build script, which release builds
# compile at build-override's opt-level 0; its texture encoders need 3.
[profile.release.package.exact-game-bake]
opt-level = 3
[profile.release.package.ctt-astcenc]
opt-level = 3
[profile.release.package.bcdec_rs]
opt-level = 3

[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dev]
opt-level = 1
debug = true

# A game's tests run thousands of ticks; the engine under them is optimized even
# in a dev build.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
taffy = { path = "../vendor/taffy" }
# The Linux host uses Exact’s base-direction shaping entry point.
cosmic-text = { path = "../vendor/cosmic-text" }
# exact-gpu presents through the patched Metal backend (vendor/wgpu-hal/EXACT-PATCHES.md).
wgpu-hal = { path = "../vendor/wgpu-hal" }

# Apple development hosts use the core's non-LTO release profile.
[profile.apple-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
[profile.apple-dev.build-override]
strip = false

# Fast surface module rebuilds; dependencies stay optimized, the game links cheaply.
[profile.gpu-dev]
inherits = "dev"
debug-assertions = false
overflow-checks = false
opt-level = 1
debug = false
strip = "debuginfo"
panic = "abort"
lto = false
incremental = true

[profile.gpu-dev.package."*"]
opt-level = 3

# The engine crates are workspace members here, so the wildcard excludes them.
[profile.gpu-dev.package.exact-game]
opt-level = 3
[profile.gpu-dev.package.exact-game-render]
opt-level = 3
[profile.gpu-dev.package.exact-game-physics]
opt-level = 3
[profile.gpu-dev.package.exact-game-audio]
opt-level = 3
