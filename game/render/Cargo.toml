[package]
name = "exact-game-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
exact-gpu-reflect = { path = "../../gpu/reflect" }

[dependencies]
exact-game = { path = "../engine" }
exact-gpu = { path = "../../gpu" }
glam = { version = "0.33", default-features = false, features = ["std", "scalar-math", "libm"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance", "console"] }

[dev-dependencies]
naga = { version = "30", features = ["spv-out", "msl-out"] }
flate2 = "1"
sha2 = "0.10"
exact-game-audio = { path = "../audio" }
exact-game-bake = { path = "../bake" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
