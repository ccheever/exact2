[package]
name = "exact-game-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
exact-gpu-reflect = { path = "../../gpu/reflect" }

[dependencies]
exact-game = { path = "../engine" }
exact-gpu = { path = "../../gpu" }
glam = { version = "0.33", default-features = false, features = ["std", "scalar-math", "libm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance", "console"] }

[dev-dependencies]
exact-game-audio = { path = "../audio" }
exact-game-bake = { path = "../bake" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
