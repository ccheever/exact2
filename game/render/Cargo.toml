[package]
name = "exact-game-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
exact-game = { path = "../engine" }
exact-gpu = { path = "../../gpu" }
glam = { version = "0.33", default-features = false, features = ["std", "scalar-math", "libm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance", "console"] }

[dev-dependencies]
lanterns-evidence-logic = { path = "../verification/lanterns/logic" }
exact-game-scene = { path = "../scene" }
serde_json = "1"
exact-game-audio = { path = "../audio" }
exact-game-bake = { path = "../bake" }
beacons-logic = { path = "../games/beacons/logic" }
greybox-logic = { path = "../games/greybox/logic" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
