# The determinism contract (game/README.md, "Determinism — the contract") as
# lints on every game's logic crate, in-tree and out-of-tree. The generated
# shells point clippy here (CLIPPY_CONF_DIR in .shells/.cargo/config.toml);
# `bun game/app/shells.mjs <game> --test`, first pins, --repin and every
# production-profile bake run it. @ref llp/1046.003-game-engine-as-built.explainer.md#determinism-lints-2026-09-23
#
# std's float transcendentals call the host's libm or an LLVM intrinsic, so
# the same bits differ across arm64, x86-64 and wasm. exact_game::math wraps
# the portable `libm` crate. sqrt is IEEE correctly rounded and stays allowed;
# glam is built with its `libm` feature, so Vec3::length, Quat::slerp and
# Vec2::from_angle are portable too.
disallowed-methods = [
  { path = "f32::sin", reason = "f32::sin differs across hosts; use exact_game::math::sin" },
  { path = "f32::cos", reason = "f32::cos differs across hosts; use exact_game::math::cos" },
  { path = "f32::tan", reason = "f32::tan differs across hosts; use exact_game::math::tan" },
  { path = "f32::sin_cos", reason = "f32::sin_cos differs across hosts; use exact_game::math::sin_cos" },
