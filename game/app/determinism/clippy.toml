disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is random per process; use std::collections::BTreeMap" },
  { path = "std::collections::HashSet", reason = "iteration order is random per process; use std::collections::BTreeSet" },
  { path = "std::collections::hash_map::RandomState", reason = "seeded per process; use std::collections::BTreeMap or BTreeSet" },
  { path = "std::hash::RandomState", reason = "seeded per process; use std::collections::BTreeMap or BTreeSet" },
  { path = "std::time::Instant", reason = "wall time differs per run; use world time: w.now(), w.dt(), w.tick_end()" },
  { path = "std::time::SystemTime", reason = "wall time differs per run; use world time: w.now(), w.dt(), w.tick_end()" },
