# The SVG island rasterizer (LLP 1055.000 §3, §8 ruling 4): the pixel work
# behind masks and filters, as pure functions over premultiplied RGBA. A
# loaded capability on Apple — `libexact_svg.dylib`, opened the first time an
# island needs it, never linked into the core host (LLP 1047 D1) — and a
# plain dependency of the Linux host, which already links a rasterizer.
[package]
name = "exact-svg-raster"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SVG islands: mask coverage and filter primitives over premultiplied RGBA"
publish = false

[lib]
name = "exact_svg_raster"
crate-type = ["rlib", "cdylib"]

[dependencies]
# The chain it runs is the resolved filter and its wire form, which the
# kernel makes: that crate and not the kernel, which a loaded module would
# otherwise compile whole (LLP 1036.000 §12).
exact-svg-filter = { path = "../../svg-filter" }
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
roxmltree = "=0.21.1"
simplecss = "=0.2.2"
svgtypes = "=0.16.1"
skrifa = "=0.44.0"
