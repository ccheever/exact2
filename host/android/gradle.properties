org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Dependency verification runs for an app whose modules name Maven libraries, against that app's own
# checksums, which agent-android.mjs puts in gradle/ and passes `--dependency-verification=strict` for it;
# no other build verifies.
org.gradle.dependency.verification=off
