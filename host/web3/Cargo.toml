# The exact3 web spike: a plan compiled ahead of time to one ES module over a
# small JavaScript runtime (`rt.js`), the DOM as the tree. Reuses the
# Contract compiler (parse, types, lower) and the web host's element and CSS
# rules (`exact_web::host::template`), so the stylesheet is the live host's CSS.
[package]
name = "exact-web3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spike: Contract plan -> JavaScript module + CSS for a ~20 KB web runtime"
publish = false

[[bin]]
name = "exact-web3"
path = "src/main.rs"

[dependencies]
contract = { path = "../../contract/cli" }
exact-kernel = { path = "../../kernel" }
exact-plan = { path = "../../plan" }
exact-runner = { path = "../../runner" }
exact-web = { path = "../web" }
serde_json = "1.0"
