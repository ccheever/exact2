[package]
name = "exact-apple-painted"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Mac benchmark carrier for the painted presenter (LLP 1149 S1.1)"

[[bin]]
name = "exact-apple-painted"
path = "src/main.rs"

[dependencies]
exact-linux = { path = "../linux" }
exact-runner = { path = "../../runner" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
exact-ink = { path = "../ink" }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
contract = { path = "../../contract/cli" }
