[package]
name = "exact-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Windows window over Exact's shared Contract and GPU presenter"
publish = false

[dependencies]
exact-linux = { path = "../linux" }
exact-runner = { path = "../../runner" }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
exact-ink = { path = "../ink" }
accesskit = "0.25.1"
accesskit_winit = { version = "0.34.1", default-features = false, features = ["rwh_06"] }
exact-kernel = { path = "../../kernel" }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
tiny-skia = "0.12"
unicode-segmentation = "1.13"
windows = { version = "0.62", features = ["UI_ViewManagement", "Foundation", "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Foundation_Collections", "Networking_Connectivity", "Win32_System_Power", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_UI_Input_XboxController", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
