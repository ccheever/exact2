<!doctype html>
<meta charset="utf-8">
<!-- @ref LLP 1038 D7 — assets resolve from the origin at any launch path. -->
<base href="/">
<title>A &amp; B</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* The page renders the kernel's tree; the kernel's defaults are CSS's for a
     bare <div>, so only UA styles that a bare div lacks are reset here. */
  html, body { margin: 0; padding: 0; height: 100%; }
  /* The appearance, before the first pixel (LLP 1034 D2). `light dark` is
     CSS for "this page supports both, the user's preference decides", which
     is what no override means on every other host — an absent NSAppearance,
     `.unspecified` on UIKit. Without it `color-scheme` is `normal`, a
     `light-dark()` colour resolves light whatever the system says, and the
     first frame of an app that never calls `setScheme` is wrong. `setScheme`
     overrides this on the element, as an app choosing light or dark. */
  html { color-scheme: light dark; }
  /* LLP 1019 §5: nearest real face, never browser-synthesized bold/italic. */
  #exact-root { height: 100%; font-synthesis: none; }
  body { font: 16px system-ui, sans-serif; }
  button, input, textarea { all: unset; display: block; box-sizing: content-box; cursor: default; }
  #exact-root button:focus-visible { outline: revert; outline-offset: 2px; }
  #exact-root button:enabled:hover { outline: 1px solid currentColor; outline-offset: 2px; }
  input, textarea { cursor: text; -webkit-user-select: text; user-select: text; }
  /* Keep the textarea's native long-word wrapping through the control reset. */
  textarea { overflow-wrap: revert; }
  /* Authored flex/grid display must not expose a closed native popover. */
  [popover]:not(:popover-open) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  /* Gesture feedback is decorative, including when its opacity is zero. */
  [swipeIndicator="true"] { pointer-events: none; }
  /* Modal dimming belongs to the host; UIKit supplies its own backdrop. */
  [navigationPresentation="modal"] { isolation: isolate; }
  [navigationPresentation="modal"]::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #00000033; }
  /* `all: unset` would inherit the field's color onto the placeholder. */
  input::placeholder, textarea::placeholder { color: light-dark(#3c3c434c, #ebebf54c); opacity: 1; }
  /* A platform material, distinct from the CSS blur-radius row. */
  [backgroundMaterial="ultra-thin"] { backdrop-filter: blur(20px) saturate(180%); background-color: light-dark(#ffffff80, #20202080); }
  [backgroundMaterial="glass"] { backdrop-filter: blur(20px) saturate(150%); background-color: light-dark(#ffffffb3, #262629b3); box-shadow: 0 8px 24px #0000000d, inset 0 0 1px light-dark(#ffffffcc, #ffffff33); }
  [data-scroll="true"] { overflow: auto; }
  /* LLP 1001 §1: the kernel has no `position: static`; every node is `relative`
     (an absolute node's inline style wins). */
  #exact-root * { position: relative; }
  img { display: block; }
  /* The kernel owns the iframe's declared 300×150 content box. Browser UA
     borders and inline baseline space must not enlarge or shift it. Scope
     this to presented nodes: the data module's hidden iframe is not UI. */
  #exact-root iframe { display: block; box-sizing: content-box; margin: 0; border: 0; }
</style>
<div id="exact-root"></div>
<link rel="alternate" type="application/vnd.exact.envelope+json" href="./exact.json">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./assets/icon.png">
<meta name="theme-color" content="#123456">
<script type="module" src="./glue.js"></script>
