<!doctype html>
<html lang="en">
<meta charset="utf-8">
<!-- @ref LLP 1038 D7 — assets resolve from the origin at any launch path. -->
<base href="/">
<title>Exact</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fetched in parallel with glue.js: its import, and the wasm it fetches
     (`fetch` is cors/same-origin; so is `crossorigin` here, same URL). -->
<link rel="modulepreload" href="./navigation.js">
<link rel="preload" href="./app.wasm" as="fetch" crossorigin>
<style>
  /* The page renders the kernel's tree; the kernel's defaults are CSS's for a
     bare <div>, so only UA styles that a bare div lacks are reset here. */
  html, body { margin: 0; padding: 0; height: 100%; }
  /* The appearance, before the first pixel (LLP 1034 D2). `light dark` is
     CSS for "this page supports both, the user's preference decides", which
     is what no override means on every other host — an absent NSAppearance,
     `.unspecified` on UIKit. Without it `color-scheme` is `normal`, a
     `light-dark()` colour resolves light whatever the system says, and the
     first frame of an app that never calls `setScheme` is wrong. `setScheme`
     overrides this on the element, as an app choosing light or dark. */
  html { color-scheme: light dark; }
  /* LLP 1019 §5: nearest real face, never browser-synthesized bold/italic. */
  #exact-root { height: 100%; font-synthesis: none; }
  body { font: 16px system-ui, sans-serif; }
  button, input, textarea { all: unset; display: block; box-sizing: content-box; cursor: default; }
  /* A link is a bare node too: the UA's link colour, underline and pointer
     go, as a button's control styling does. A \`link\` is block-level like any
     node; a run with an \`href\` stays inline in its paragraph. Markdown's own
     links (never views) keep the UA's look. */
  #exact-root a[data-view] { color: inherit; text-decoration: none; cursor: default; display: block; }
  #exact-root [data-exact-text] a[data-view] { display: inline; }
  /* A text node with a heading level is an <h1>–<h6> for the accessibility
     tree; its box is a bare div's, so the UA's heading margins, size and
     weight go. The node's own style rows, inline, still win. */
  h1, h2, h3, h4, h5, h6 { margin: 0; font-size: inherit; font-weight: inherit; }
  #exact-root button:focus-visible { outline: revert; outline-offset: 2px; }
  /* The UA's own reset, which \`all: unset\` undid: a field shows what was
     typed, as the kernel measures it and native fields draw it (LLP 1064 D6). */
  input, textarea { cursor: text; -webkit-user-select: text; user-select: text; text-transform: none; }
  /* Keep the textarea's native long-word wrapping through the control reset. */
  textarea { overflow-wrap: revert; }
  /* Authored flex/grid display must not expose a closed native popover. */
  [popover]:not(:popover-open) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  /* Gesture feedback is decorative, including when its opacity is zero. */
  [swipeIndicator="true"] { pointer-events: none; }
  /* Modal dimming belongs to the host; UIKit supplies its own backdrop. */
  [navigationPresentation="modal"] { isolation: isolate; }
  [navigationPresentation="modal"]::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #00000033; }
  /* `all: unset` would inherit the field's color onto the placeholder. */
  input::placeholder, textarea::placeholder { color: light-dark(#3c3c434c, #ebebf54c); opacity: 1; }
  /* A platform material (host policy, LLP 1053.000 D3): it wins over an authored backdrop-filter on the same node, as the native hosts do. */
  [backgroundMaterial="ultra-thin"] { backdrop-filter: blur(20px) saturate(180%) !important; background-color: light-dark(#ffffff80, #20202080); }
  [backgroundMaterial="glass"] { backdrop-filter: blur(20px) saturate(150%) !important; background-color: light-dark(#ffffffb3, #262629b3); box-shadow: 0 8px 24px #0000000d, inset 0 0 1px light-dark(#ffffffcc, #ffffff33); }
  /* LLP 1061: a press multiplies the scale row's current number, including
     during a CSS transition. Keep it local to the node, as `scale` is. */
  @property --exact-press-factor { syntax: "<number>"; inherits: false; initial-value: 1; }
  @property --exact-scale { syntax: "<number>"; inherits: false; initial-value: 1; }
  [data-scroll="true"] { overflow: auto; }
  /* LLP 1048.003 D4: `scroll document` — the page scrolls, not an inner
     scroller. Body and root grow with the content and the marked scroller is
     a plain block, so printing, #anchors, scroll restoration and a collapsing
     browser toolbar work, with JavaScript or without. */
  html:has([data-scrolldocument="true"]) {
    & body { height: auto; min-height: 100%; }
    & #exact-root { height: auto; }
    & [data-scrolldocument="true"] { overflow: visible !important; height: auto !important; max-height: none !important; }
  }
  [data-itemheight], [data-estimateditemheight] { overflow-anchor: none; } /* List keys own the reading anchor. */
  /* LLP 1001 §1: the kernel has no `position: static`; every node is `relative`
     (an absolute node's inline style wins). */
  #exact-root * { position: relative; }
  /* LLP 1055 D3: an `svg` is a block, as every node is (declared deviation from HTML's inline replaced svg). */
  img, video, svg { display: block; }
  /* The kernel owns the iframe's declared 300×150 content box. Browser UA
     borders and inline baseline space must not enlarge or shift it. Scope
     this to presented nodes: the data module's hidden iframe is not UI. */
  #exact-root iframe { display: block; box-sizing: content-box; margin: 0; border: 0; }
</style>
<div id="exact-root"></div>
<script type="module" src="./glue.js"></script>
