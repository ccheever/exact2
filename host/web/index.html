<!doctype html>
<html lang="en">
<meta charset="utf-8">
<!-- @ref LLP 1038 D7 — assets resolve from the origin at any launch path. -->
<base href="/">
<title>Exact</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fetched in parallel with glue.js: its import, and the wasm it fetches
     (`fetch` is cors/same-origin; so is `crossorigin` here, same URL). -->
<link rel="modulepreload" href="./navigation.js">
<link rel="preload" href="./app.wasm" as="fetch" crossorigin>
<style>
  /* The page renders the kernel's tree; the kernel's defaults are CSS's for a
     bare <div>, so only UA styles that a bare div lacks are reset here. */
  html, body { margin: 0; padding: 0; height: 100%; }
  /* The appearance, before the first pixel (LLP 1034 D2). `light dark` is
     CSS for "this page supports both, the user's preference decides", which
     is what no override means on every other host — an absent NSAppearance,
     `.unspecified` on UIKit. Without it `color-scheme` is `normal`, a
     `light-dark()` colour resolves light whatever the system says, and the
     first frame of an app that never calls `setScheme` is wrong. `setScheme`
     overrides this on the element, as an app choosing light or dark. */
  html { color-scheme: light dark; }
  /* Press feedback is the node's own (`-exact-press-scale`, LLP 1061); a page
     shows none unless it declares one (the iOS host dims an undeclared custom
     pressable as UIKit does, LLP 1115, which a web page is not). Mobile
     WebKit's grey tap highlight would paint over it on every button and link. A
     native button keeps a highlight as UIButton does: the input glue marks it
     `data-pressed` by the same rule as a press, and its face dims. */
  html { -webkit-tap-highlight-color: transparent; }
  /* LLP 1019 §5: nearest real face, never browser-synthesized bold/italic. */
  #exact-root { height: 100%; font-synthesis: none; }
  /* LLP 1069.000 D3: unsized text takes the root font size (16 unless the
     reader's setting or the agent's `prefer root-font-size` says otherwise),
     as the kernel resolves an `em` under no sized ancestor. */
  body { font: 1rem system-ui, sans-serif; }
  button, input, textarea { all: unset; display: block; box-sizing: content-box; cursor: default; }
  /* Native text fields keep the UA's chrome and content-box sizing, with
     the common reset's inherited typography (LLP 1104 D4, D8). */
  #exact-root [data-native] { all: revert; display: block; font: inherit; letter-spacing: inherit; color: inherit; }
  #exact-root [data-native]:disabled { color: revert; }
  select { display: block; }
  /* The row's background paints its separator under content, including on
     replaced/static elements. Its padding box ends at the inner border edge.
     Authored background paint keeps the second layer and its original clip. */
  @property --exact-grouped-separator { syntax: "<color>"; inherits: false; initial-value: #3c3c431f; }
  [data-grouped-row-separator] { --exact-grouped-separator: light-dark(#3c3c431f, #54545880); --exact-grouped-line: none; --exact-grouped-mask: none; background-image: var(--exact-grouped-line), var(--exact-grouped-background, none) !important; background-size: calc(100% - var(--exact-grouped-inset, 0px)) 1px, auto; background-position: right bottom, 0% 0%; background-repeat: no-repeat, repeat; background-origin: padding-box, padding-box; background-clip: padding-box, var(--exact-grouped-background-clip, border-box) !important; background-attachment: scroll, var(--exact-grouped-background-attachment, scroll) !important; }
  [data-grouped-row-separator="true"]:not([data-grouped-row-hidden="true"]):has(~ [data-grouped-row-separator]:not([data-grouped-row-hidden="true"])) { --exact-grouped-line: linear-gradient(var(--exact-grouped-separator), var(--exact-grouped-separator)); --exact-grouped-mask: linear-gradient(#fff, #fff); }
  /* Template images mask their own content, not the separator rectangle. */
  img[data-grouped-row-separator]:is([data-exact-template], [data-symbol-path]) { mask-image: var(--exact-grouped-mask), var(--exact-grouped-image-mask, var(--exact-symbol-mask)) !important; mask-size: calc(100% - var(--exact-grouped-inset, 0px)) 1px, var(--exact-grouped-image-fit, var(--exact-symbol-fit, 100% 100%)) !important; mask-position: right bottom, center !important; mask-repeat: no-repeat !important; mask-origin: padding-box, content-box !important; mask-clip: padding-box, content-box !important; }
  /* A link is a bare node too: the UA's link colour, underline and pointer
     go, as a button's control styling does. A \`link\` is block-level like any
     node and inherits its colour; a run with an \`href\` stays inline in its
     paragraph, and its colour is the compiler's unsaid \`LinkText\` row,
     inline, so the browser's own link colour (LLP 1115 §3). Markdown's own
     links (never views) keep the UA's look. */
  #exact-root a[data-view] { color: inherit; text-decoration: none; cursor: default; display: block; }
  #exact-root [data-exact-text] a[data-view] { display: inline; }
  /* A text node with a heading level is an <h1>–<h6> for the accessibility
     tree; its box is a bare div's, so the UA's heading margins, size and
     weight go. The node's own style rows, inline, still win. */
  h1, h2, h3, h4, h5, h6 { margin: 0; font-size: inherit; font-weight: inherit; }
  #exact-root button:not([data-native]):focus-visible,
  #exact-root input:not([data-native]):focus-visible,
  #exact-root textarea:not([data-native]):not([markup="markdown"]):focus-visible { outline: revert; outline-offset: 2px; }
  /* The UA's own reset, which \`all: unset\` undid: a field shows what was
     typed, as the kernel measures it and native fields draw it (LLP 1064 D6). */
  #exact-root [data-native], input, textarea { cursor: text; -webkit-user-select: text; user-select: text; text-transform: none; }
  /* A checkbox, radio, range or date control is the platform's again (LLP 1069.001 D3, D6): its
     size is the UA's; `appearance: none` on the node hands it to the author. */
  input[type="checkbox"], input[type="radio"], input[type="file"], input[type="range"], input[type="date"], input[type="time"], input[type="datetime-local"] { appearance: auto; cursor: default; -webkit-user-select: none; user-select: none; }
  input[type="checkbox"], input[type="radio"] { box-sizing: border-box; }
  /* LLP 1104 D4: native buttons inherit the page's typography. Face fields
     use grid areas so a subtitle remains under its title beside a symbol.
     The empty gap is a real space glyph, D3's declared web approximation. */
  #exact-root button[data-button-style] { appearance: auto; box-sizing: border-box; cursor: default; white-space: normal; text-align: center; letter-spacing: inherit; word-spacing: normal; text-transform: none; text-shadow: none; font-variant: normal; font-size: var(--exact-control-font-size, inherit); border-radius: var(--exact-control-radius, revert); align-items: center; justify-content: var(--exact-button-align, center); gap: 0; row-gap: 0 !important; column-gap: 0 !important; grid-template-areas: "title" "subtitle"; grid-template-columns: minmax(0,auto); overflow: hidden; -webkit-user-select: none; user-select: none;
    --exact-control-font-size: initial; --exact-control-radius: initial; --exact-button-align: initial; --exact-button-clamp: initial; --exact-button-title-display: initial; --exact-button-accent-fill: initial; --exact-button-row-gap: initial; --exact-button-column-gap: initial; --exact-button-row-space: " "; --exact-button-column-space: " "; --exact-button-space: var(--exact-button-column-space); --exact-button-leading-areas: initial; --exact-button-leading-subtitle-areas: initial; --exact-button-trailing-areas: initial; --exact-button-trailing-subtitle-areas: initial; --exact-button-columns: initial; --exact-button-space-width: initial; --exact-button-space-height: initial; }
  #exact-root button[data-button-style]:has(> img) { grid-template-areas: var(--exact-button-leading-areas, "image space title"); grid-template-columns: var(--exact-button-columns, auto auto minmax(0,auto)); }
  #exact-root button[data-button-style]:has(> [data-exact-text] ~ img) { grid-template-areas: var(--exact-button-trailing-areas, "title space image"); }
  #exact-root button[data-button-style]:has(> img):has(> [data-exact-text] ~ [data-exact-text]) { grid-template-areas: var(--exact-button-leading-subtitle-areas, "image space title" "image space subtitle"); }
  #exact-root button[data-button-style]:has(> [data-exact-text] ~ [data-exact-text] ~ img) { grid-template-areas: var(--exact-button-trailing-subtitle-areas, "title space image" "subtitle space image"); }
  #exact-root button[data-button-style]:has(> img:only-child) { grid-template-areas: "image"; grid-template-columns: auto; }
  #exact-root button[data-button-style]:has(> img):has(> [data-exact-text])::before { content: var(--exact-button-space); white-space: pre; grid-area: space; line-height: 0; width: var(--exact-button-space-width,var(--exact-button-column-gap,auto)); height: var(--exact-button-space-height,0px); }
  #exact-root button[data-button-style] > [data-exact-text] { grid-area: title; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: inherit; display: var(--exact-button-title-display, block) !important; -webkit-box-orient: vertical; -webkit-line-clamp: var(--exact-button-clamp, none); }
  #exact-root button[data-button-style] > [data-exact-text] ~ [data-exact-text] { grid-area: subtitle; font-size: .8em; color: color-mix(in srgb, currentColor 70%, transparent); }
  #exact-root button[data-button-style] > img { grid-area: image; --exact-tint: currentColor; --exact-symbol-size-authored: 0; --exact-symbol-weight-authored: 0; width: 1em; height: 1em; }
  button[data-button-style][data-pressed] > * { opacity: .5; }
  #exact-root button:is([data-button-style="plain"], [data-button-style="borderless"], [data-button-style="tinted"], [data-button-style="bordered-tinted"], [data-button-style="filled"], [data-button-style="bordered-prominent"], [data-button-style$="glass"]) { appearance: none; border: none; border-radius: var(--exact-control-radius, revert); padding: .4375em .75em; --exact-button-face-padding: .75em; }
  /* A native grouped button owns its leading inset; it is part of fitting,
     independently of the separator and the browser button's own face padding. */
  #exact-root button[data-button-style][data-grouped-row-separator] { padding-left: calc(16px + var(--exact-button-face-padding, 6px)); }
  #exact-root button:is([data-button-style="plain"], [data-button-style="borderless"]) { background: none; color: var(--exact-accent, AccentColor); }
  #exact-root button:is([data-button-style="tinted"], [data-button-style="bordered-tinted"]) { background: color-mix(in srgb, var(--exact-accent, AccentColor) 15%, transparent); color: var(--exact-accent, AccentColor); }
  #exact-root button:is([data-button-style="filled"], [data-button-style="bordered-prominent"]) { background: var(--exact-accent, AccentColor); --exact-button-accent-fill: var(--exact-accent); color: #fff; }
  #exact-root button:is([data-button-style="glass"], [data-button-style="prominent-glass"]) { backdrop-filter: blur(20px) saturate(150%) !important; background: light-dark(#ffffffb3, #262629b3); color: CanvasText; box-shadow: 0 8px 24px #0000000d, inset 0 0 1px light-dark(#ffffffcc, #ffffff33); }
  #exact-root button:is([data-button-style="clear-glass"], [data-button-style="prominent-clear-glass"]) { backdrop-filter: blur(10px) saturate(120%) !important; background: light-dark(#ffffff26, #ffffff1a); color: CanvasText; box-shadow: inset 0 0 1px light-dark(#ffffffcc, #ffffff33); }
  #exact-root button:is([data-button-style="prominent-glass"], [data-button-style="prominent-clear-glass"]) { background: color-mix(in srgb, var(--exact-accent, AccentColor) 85%, transparent); --exact-button-accent-fill: color-mix(in srgb, var(--exact-accent) 85%, transparent); color: #fff; }
  /* Disabled UA ink, while inline author colours and symbol tint still win. */
  #exact-root button[data-button-style]:disabled { color: GrayText; }
  #exact-root button:is([data-button-style="filled"], [data-button-style="bordered-prominent"], [data-button-style$="glass"]):disabled { background-color: var(--exact-button-accent-fill, color-mix(in srgb, var(--exact-accent, AccentColor) 45%, transparent)); }
  #exact-root button:is([data-button-style="plain"], [data-button-style="borderless"], [data-button-style="tinted"], [data-button-style="bordered-tinted"]):disabled { color: var(--exact-accent, GrayText); }
  /* An indeterminate progress (LLP 1069.001, amended 2026-10-07): HTML's draws a bar, so the page draws the
     platform's spinner instead, the one deliberate divergence from the web's own control: an arc fading to `color`
     in a circle at the shorter side of the content box, centred, a turn a second (UIActivityIndicatorView's period).
     The box is a grid (element.rs `progress_css`), so this item fills its content box, sized or not; the mask's
     circle and the gradient's centre stay put as it turns. Under the agent it follows the agent's clock, as every
     CSS animation does. */
  [data-exact-progress]::before { content: ""; pointer-events: none; background: conic-gradient(transparent 10%, currentColor); mask: radial-gradient(circle closest-side, transparent 76%, #000 calc(76% + .5px) calc(100% - .5px), transparent 100%); animation: exact-progress 1s linear infinite; }
  @keyframes exact-progress { to { rotate: 1turn; } }
  /* Keep the textarea's native long-word wrapping through the control reset. */
  textarea { overflow-wrap: revert; }
  /* Authored flex/grid display must not expose a closed native popover. */
  [popover]:not(:popover-open) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  /* Gesture feedback is decorative, including when its opacity is zero. */
  [swipeIndicator="true"] { pointer-events: none; }
  /* Modal dimming belongs to the host; UIKit supplies its own backdrop. It dims the route the
     sheet covers (the navigation glue marks it), so the sheet's own background paints undimmed (recipes F6). */
  [navigationPresentation="modal"] { isolation: isolate; position: relative; }
  [data-exact-covered]::after { content: ""; position: absolute; inset: 0; background: #00000033; pointer-events: none; }
  /* `all: unset` would inherit the field's color onto the placeholder. */
  input:not([data-native])::placeholder, textarea:not([data-native])::placeholder { color: light-dark(#3c3c434c, #ebebf54c); opacity: 1; }
  /* A platform material (host policy, LLP 1053.000 D3, D4): the schema's approximation of the named material, from the variables the host sets
     (element.rs `material_css`). It wins over an authored backdrop-filter on the same node, as the native hosts do. */
  [backgroundMaterial] { backdrop-filter: blur(var(--exact-material-blur)) saturate(var(--exact-material-saturate)) !important; background-color: light-dark(var(--exact-material-light), var(--exact-material-dark)); }
  [backgroundMaterial^="glass"] { box-shadow: 0 8px 24px #0000000d, inset 0 0 1px light-dark(#ffffffcc, #ffffff33); }
  /* LLP 1061: a press multiplies the scale row's current number, including
     during a CSS transition. Keep it local to the node, as `scale` is. */
  @property --exact-press-factor { syntax: "<number>"; inherits: false; initial-value: 1; }
  @property --exact-scale { syntax: "<number>"; inherits: false; initial-value: 1; }
  [data-scroll="true"] { overflow: auto; }
  /* LLP 1048.003 D4: `scroll document` — the page scrolls, not an inner
     scroller. Body and root grow with the content and the marked scroller is
     a plain block, so printing, #anchors, scroll restoration and a collapsing
     browser toolbar work, with JavaScript or without. The render host and
     the runtimes mark `<html>` while an element is the page's scroller. */
  html[data-scrolldocument] {
    & body { height: auto; min-height: 100%; }
    & #exact-root { height: auto; }
    & [data-scrolldocument="true"] { overflow: visible !important; height: auto !important; max-height: none !important; }
  }
  [data-itemheight], [data-estimateditemheight] { overflow-anchor: none; } /* List keys own the reading anchor. */
  /* LLP 1055 D3: an `svg` is a block, as every node is (declared deviation from HTML's inline replaced svg). */
  img, video, svg { display: block; }
  /* The kernel owns the iframe's declared 300×150 content box. Browser UA
     borders and inline baseline space must not enlarge or shift it. Scope
     this to presented nodes: the data module's hidden iframe is not UI. */
  #exact-root iframe { display: block; box-sizing: content-box; margin: 0; border: 0; }
</style>
<div id="exact-root"></div>
<script type="module" src="./glue.js"></script>
