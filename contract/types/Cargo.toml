# Contract types: closed-type inference. Stdlib signatures come from the
# plan format's roster, so the checker and the VM agree by construction.
[package]
name = "contract-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Contract closed-type inference over the AST"
publish = false

[lib]
name = "contract_types"
crate-type = ["rlib"]

[dependencies]
contract-syntax = { path = "../syntax" }
exact-num = { path = "../../num" }
exact-plan = { path = "../../plan" }
exact-route = { path = "../../route" }
