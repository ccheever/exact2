# Contract lowering: the typed, analyzed AST → plan tables and bytecode, in
# the kernel's vocabulary, byte-identically. @ref LLP 1004 D2.
[package]
name = "contract-lower"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Contract lowering: component inlining, the tag/attribute table onto kernel rows, expression codegen, plan tables"
publish = false
# Lists `tags.rs`'s lookups for `contract vocab` (LLP 1086 D3).
build = "build.rs"

[lib]
name = "contract_lower"
crate-type = ["rlib"]

[dependencies]
contract-analyze = { path = "../analyze" }
contract-syntax = { path = "../syntax" }
contract-types = { path = "../types" }
exact-kernel = { path = "../../kernel" }
exact-plan = { path = "../../plan" }
exact-motion = { path = "../../motion" }
exact-num = { path = "../../num" }

# CLDR script direction is baked per table; no locale data ships in a host.
icu_locale = "=2.3.0"

[build-dependencies]
# The kernel schema's style defaults, for `contract vocab`.
serde_json = "1.0"
