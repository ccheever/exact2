# The Contract compiler driver: the pipeline as one call, the CLI, and the
# build-time bake (one runner boot against the app's data source, so every
# resource's boot value ships inside the plan). @ref LLP 1004 D2/D4.
[package]
name = "contract"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Contract compiler driver: parse → types → analyze → lower, plus the build-time bake and the CLI"
publish = false

[lib]
name = "contract"
crate-type = ["rlib"]

[[bin]]
name = "contract"
path = "src/main.rs"

[dependencies]
contract-analyze = { path = "../analyze" }
contract-lower = { path = "../lower" }
contract-syntax = { path = "../syntax" }
contract-types = { path = "../types" }
exact-kernel = { path = "../../kernel" }
exact-plan = { path = "../../plan" }
exact-runner = { path = "../../runner" }
# The compatibility id (LLP 1030 D3a): the manifest read, the inputs as
# JSON, the digest. The runtime crates take neither.
serde_json = "1.0"
sha2 = "0.10"
# The shaders' interface digests for the compatibility id (LLP 1030 D8).
exact-gpu-reflect = { path = "../../gpu/reflect" }

# The build validates publisher receipt signatures using the client parser.
exact-update = { path = "../../update" }

# The same owned-directory gate as the copy/publish helper, on build hosts only.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
exact-filesystem = { path = "../../filesystem" }
