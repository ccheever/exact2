[package]
name = "ibex2"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "ibex2"
path = "src/bin/ibex2.rs"
required-features = ["hermes"]

# Deliberately dependency-free, and deliberately not linked to an engine yet.
# The grant model below is pure Rust and testable today; the engine adapter
# arrives with the spike, behind a feature, so the workspace stays green on a
# machine that has not built vanilla Hermes.
# The speed instrument needs the engine; the graph walk does not.
[[example]]
name = "speed"
required-features = ["hermes", "loader"]

[[example]]
name = "graph"
required-features = ["loader"]

[dependencies]
libc = "0.2"
# LLP 0059.000 §3.4: a partial URL parser is a security bug rather than a
# missing feature, so URL is a well-tested crate and not hand-written.
base64 = "0.22"
getrandom = "0.2"
# Pinned to the workspace's versions. LLP 0028 makes Oxc the transform
# authority; ESM lowering is a transform, so it uses the same parser. All
# optional, behind the `loader` feature: a run-only binary and a Rust
# consumer of the standard library (LLP 0068) never turn source into a
# wrapper or a specifier into a file, and should not carry the crates that do.
oxc_allocator = { version = "=0.140.0", optional = true }
oxc_ast = { version = "=0.140.0", optional = true }
oxc_ast_visit = { version = "=0.140.0", optional = true }
oxc_codegen = { version = "=0.140.0", optional = true }
oxc_parser = { version = "=0.140.0", optional = true }
oxc_resolver = { version = "=11.24.2", optional = true }
oxc_semantic = { version = "=0.140.0", optional = true }
oxc_span = { version = "=0.140.0", optional = true }
oxc_transformer = { version = "=0.140.0", optional = true }
form_urlencoded = "1.2"
sha2 = "0.10"
url = "2.5"

[dev-dependencies]
ibex2-sqlite = { path = "../ibex2-sqlite" }
# Exercise the portable transport on Apple too, without linking it in Apple builds.
socket2 = "0.6"
libc = "0.2"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"
# To bake the linked engine's digest into the binary (see build.rs).
sha2 = "0.10"

# The transport off Apple platforms (LLP 0057 §3; OQ2 of LLP 0068, resolved
# 2026-08-30): HTTP/1.1 over rustls with the webpki roots — pure Rust, no
# system TLS, nothing a builder without -dev packages lacks. Redirects and
# the rest of `fetch` stay above it, in Rust, as on Apple.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
socket2 = "0.6"
libc = "0.2"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
# The trust store is the platform's (LLP 0057 §3): the distro's CA bundle
# through rustls-native-certs; the compiled-in webpki roots only where the
# machine has none. The same rustls ureq pins, so one copy is linked.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"

[features]
default = ["loader"]
# The loader: TypeScript and JSX stripping, ESM lowering, and package
# resolution — everything that turns source into a wrapper and a specifier
# into a file. `ibex2 build` needs it; a `run --precompiled` does not, since
# the build recorded every edge in the manifest and every artifact in the
# bundle. Off, the binary is run-only and carries no Oxc at all.
loader = [
    "dep:oxc_allocator",
    "dep:oxc_ast",
    "dep:oxc_ast_visit",
    "dep:oxc_codegen",
    "dep:oxc_parser",
    "dep:oxc_resolver",
    "dep:oxc_semantic",
    "dep:oxc_span",
    "dep:oxc_transformer",
]
# Link against vanilla Hermes from the platform's Frameworks-vanilla install.
# Off by default so the workspace builds without an engine present.
hermes = []
