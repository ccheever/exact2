default-features = false

[dependencies.bitflags]
version = "2"

[dependencies.bytemuck]
version = "1"
features = ["derive"]
optional = true

[dependencies.glamx]
version = "0.3"
default-features = false

[dependencies.log]
version = "0.4"

[dependencies.num-traits]
version = "0.2"
default-features = false

[dependencies.parry3d]
version = "0.30.2"
features = ["required-features"]
default-features = false

[dependencies.profiling]
version = "1.0"

[dependencies.rayon]
version = "1"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true
default-features = false

[dependencies.simba]
version = "0.10.2"
features = ["wide"]
default-features = false

[dependencies.static_assertions]
version = "1"

[dependencies.thiserror]
version = "2"
default-features = false

[dependencies.web-time]
version = "1.1"
optional = true

[dependencies.wide]
version = "1"
default-features = false

[dev-dependencies.bincode]
version = "1"

[dev-dependencies.oorandom]
version = "11"
default-features = false

[dev-dependencies.serde]
version = "1"
features = [
    "derive",
    "std",
]
default-features = false

[dev-dependencies.serde_json]
version = "1"

[target.'cfg(not(target_arch = "spirv"))'.dependencies.glamx]
version = "0.3"
features = ["nalgebra"]
default-features = false

[target.'cfg(not(target_arch = "spirv"))'.dependencies.nalgebra]
version = "0.35"
features = ["macros"]
default-features = false

[lints.clippy]
needless_lifetimes = "allow"

