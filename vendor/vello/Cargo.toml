# EXACT: vello 0.10.0 from crates.io, renamed `exact-vello` and patched for
# the Canvas 2D GPU module (canvas/vello, bake/canvas-vello). Every change is
# marked `EXACT:` in the source. The Linux host keeps the crates.io vello.
[package]
edition = "2024"
rust-version = "1.88"
name = "exact-vello"
version = "0.10.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A GPU compute-centric 2D renderer."
readme = "README.md"
keywords = [
    "2d",
    "vector-graphics",
]
categories = [
    "rendering",
    "graphics",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []

[features]
# EXACT: the wgpu engine only; its shaders come precompiled from the caller
# (no vello_shaders, no WGSL at run time). The other features are declared so
# vello's cfgs stay checked; they are unused here.
default = ["wgpu"]
wgpu = ["dep:wgpu"]
bump_estimate = ["vello_encoding/bump_estimate"]
debug_layers = []
hot_reload = []
wgpu-profiler = []

[lib]
name = "vello"
path = "src/lib.rs"

[dependencies.bytemuck]
version = "1.25.0"
features = ["derive"]

[dependencies.log]
version = "0.4.29"

[dependencies.peniko]
version = "0.6.1"
default-features = true

[dependencies.png]
version = "0.18.1"

[dependencies.skrifa]
version = "0.44.0"
features = [
    "autohint_shaping",
    "std",
]
default-features = false

[dependencies.static_assertions]
version = "1.1.0"

[dependencies.thiserror]
version = "2.0.18"
default-features = false

[dependencies.vello_encoding]
version = "0.10.0"

[dependencies.wgpu]
version = "29.0.3"
features = ["std"]
optional = true
default-features = false

[lints.clippy]
allow_attributes_without_reason = "warn"
cargo_common_metadata = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
default_trait_access = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
too_many_arguments = "allow"
unseparated_literal_suffix = "warn"
use_self = "warn"
wildcard_dependencies = "warn"

[lints.rust]
elided_lifetimes_in_paths = "warn"
keyword_idents_2024 = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "forbid"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
