[package]
name = "hermes-lean-sys-installer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "hermes-lean-sys-installer"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
