[package]
name = "ibex2"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
exact-grants = { path = "../../../../grants" }
libc = "0.2"
# LLP 0059.000 §3.4: a partial URL parser is a security bug rather than a
# missing feature, so URL is a well-tested crate and not hand-written.
base64 = "0.22"
getrandom = "0.2"
form_urlencoded = "1.2"
sha2 = "0.10"
ring = { version = "0.17", optional = true }
url = "2.5"
serde_json = "1"
# The normal dependency owns native link lines selected by binding-family
# features. The build dependency below supplies headers and hermesc only.
hermes-lean-sys = { path = "../hermes-lean-sys", optional = true, default-features = false }

[dev-dependencies]
ibex2-sqlite = { path = "../ibex2-sqlite" }
# Exercise the portable transport on Apple too, without linking it in Apple builds.
socket2 = "0.6"
libc = "0.2"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"
hermes-lean-sys = { path = "../hermes-lean-sys", optional = true, default-features = false }

# The transport off Apple platforms (LLP 0057 §3; OQ2 of LLP 0068, resolved
# 2026-08-30): HTTP/1.1 over rustls with the webpki roots — pure Rust, no
# system TLS, nothing a builder without -dev packages lacks. Redirects and
# the rest of `fetch` stay above it, in Rust, as on Apple. Exact patch 3 also
# builds it on macOS for the render host; Apple device platforms omit it.
[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos")))'.dependencies]
socket2 = "0.6"
libc = "0.2"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
# The trust store is the platform's (LLP 0057 §3): the distro's CA bundle
# through rustls-native-certs; the compiled-in webpki roots only where the
# machine has none. The same rustls ureq pins, so one copy is linked.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
# The compiled-in roots for a socket's own TLS where the machine has none
# (the copy ureq already links).
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[target.'cfg(windows)'.dev-dependencies]
# Restore only the owned document-refusal fixture's captured DACL.
windows-sys = { version = "0.61.2", features = ["Win32_Security_Authorization"] }

[features]
default = ["crypto", "websocket"]
bindings = ["dep:hermes-lean-sys"]
# Linux's JSI Intl shims and full locale data exceed LLP 0057.000 D5's
# default-on budget. Selecting Intl also selects the bindings door; ICU link
# lines and the trimmed/full data swap still come from hermes-lean-sys alone.
intl = ["bindings", "hermes-lean-sys/icu-full-data"]
# Symmetric WebCrypto algorithms backed by the workspace's unmodified,
# vendored ring. Randomness remains available without this feature.
crypto = ["dep:ring"]
# ECDSA P-256, Ed25519, and their SPKI/PKCS#8 codecs exceed LLP 0057.000
# D6's default-on size budget, so consumers opt in explicitly.
crypto-asymmetric = ["crypto"]
# Application WebSockets. The grant grammar and the refusing Rust/JS surface
# remain present when this is off; only the transport implementation is cut.
websocket = []
test-support = []
