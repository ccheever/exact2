[workspace]

[package]
name = "ibex2-sqlite"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
ibex2 = { path = "../ibex2", default-features = false }
rusqlite = { version = "0.40.2", features = ["hooks", "limits", "extra_check"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
