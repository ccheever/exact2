[package]
name = "clod-view"
version = "0.1.0"
edition = "2024"
autobins = false
license = "MIT"

[dependencies]
clod-format = { path = "../format" }
bytemuck.workspace = true
serde = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck", "serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
pollster = "1"
png = "0.18"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgpu"] }

[build-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
cc = "1"

[dev-dependencies]
sha2.workspace = true
clod-bake = { path = "../bake" }

[[bin]]
name = "clod-view"
path = "src/main.rs"
