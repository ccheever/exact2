<!doctype html><meta charset="utf-8"><script src="node_modules/phaser/dist/phaser.js"></script><script>
let player,lanterns,collected=0,moving=false,time=0,scene;
const game=new Phaser.Game({type:Phaser.CANVAS,width:320,height:180,audio:{noAudio:true},banner:false,scene:{create(){scene=this;player=this.add.rectangle(20,90,12,12,0x00ddff);lanterns=[60,100,140].map(x=>this.add.rectangle(x,90,8,8,0xffcc00));this.input.keyboard.on('keydown-RIGHT',()=>moving=true);this.input.keyboard.on('keyup-RIGHT',()=>moving=false);window.probe={input(on){window.dispatchEvent(new KeyboardEvent(on?'keydown':'keyup',{key:'ArrowRight',code:'ArrowRight',keyCode:39,bubbles:true}));},ticks(n){game.loop.stop();for(let i=0;i<n;i++)game.step(time+=1000/60,1000/60);},state(){return {x:player.x,collected,lanterns:lanterns.filter(x=>x.active&&x.visible).length,objects:scene.children.list.length};},reset(){game.loop.stop();moving=false;player.x=20;collected=0;lanterns.forEach(x=>x.setVisible(true));}};},update(){if(moving)player.x+=2;for(const l of lanterns)if(l.visible&&Math.abs(player.x-l.x)<8){l.setVisible(false);collected++;}}}});
</script>
