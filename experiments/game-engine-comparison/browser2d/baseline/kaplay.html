<!doctype html><meta charset="utf-8"><body><script src="node_modules/kaplay/dist/kaplay.js"></script><script>
const k=kaplay({width:320,height:180,global:false,debug:true,background:[10,10,10]});
let collected=0,moving=false;const player=k.add([k.pos(20,90),k.rect(12,12),k.color(0,221,255),'player']);const lanterns=[60,100,140].map(x=>k.add([k.pos(x,90),k.rect(8,8),k.color(255,204,0),'lantern']));
k.onUpdate(()=>{if(moving)player.pos.x+=2;for(const l of lanterns)if(!l.hidden&&Math.abs(player.pos.x-l.pos.x)<8){l.hidden=true;collected++;}});
k.onKeyPress('right',()=>moving=true);k.onKeyRelease('right',()=>moving=false);
k.onLoad(()=>{k.debug.paused=true;window.probe={input(on){moving=on;},ticks(n){for(let i=0;i<n;i++)k.debug.stepFrame();},state(){return {x:player.pos.x,collected,lanterns:k.get('lantern').filter(x=>!x.hidden).length,objects:k.get('*').length};},reset(){moving=false;player.pos.x=20;collected=0;lanterns.forEach(x=>x.hidden=false);}};});
</script>
