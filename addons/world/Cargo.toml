[workspace]
members = ["world", "world/derive", "world-source", "tally/logic", "tally/data", "tally/web", "tally/apple", "tally/linux"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
[patch.crates-io]
taffy = { path = "../../vendor/taffy" }
cosmic-text = { path = "../../vendor/cosmic-text" }
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
