[package]
name = "exact-data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
exact-plan = { path = "../plan" }
exact-runner = { path = "../runner" }
serde_json = "1.0"
# Digests and OS entropy for sources (LLP 1069.005 D5).
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"

[dev-dependencies]
# The runner-level tests boot a plan against a kernel.
exact-kernel = { path = "../kernel" }
