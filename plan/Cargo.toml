# The plan format: the one table authority the compiler emits and the runner
# executes. Everything is generated from tables/format.json by build.rs into
# OUT_DIR, never committed.
#
# @ref LLP 1004 D2 (five crates on one table authority) / LLP 0485 (research).
#
# Depends on nothing and declares no kernel vocabulary: plan rows carry kernel
# ordinals as numbers; exact-kernel gives them meaning elsewhere.
[package]
name = "exact-plan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The plan format: tables, bytecode, and the validating decoder, generated from one JSON authority"
publish = false
build = "build.rs"

[lib]
name = "exact_plan"
crate-type = ["rlib"]

[dependencies]
exact-num = { path = "../num" }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
