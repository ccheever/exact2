# The T3 Code clone's own workspace, absent from the root `members`, as the game
# add-on's is (game/Cargo.toml): its build script bakes the whole app on one
# core for minutes, so exact2's six checks never compile it. The async
# lane builds, tests and lints it (`scripts/async.mjs`); `host/apple/build.mjs`
# finds it through `macos/Cargo.toml`'s (and `mobile/ios/Cargo.toml`'s) `package.workspace` and
# passes the root's profiles.
[workspace]
members = ["data", "macos", "mobile/ios"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
taffy = { path = "../../vendor/taffy" }
parley = { path = "../../vendor/parley" }
fontique = { path = "../../vendor/fontique" }
wgpu-hal = { path = "../../vendor/wgpu-hal" }
