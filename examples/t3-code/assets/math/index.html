<!doctype html>
<!-- One display formula, typeset as T3 Code's MarkdownMath typesets it (render.js). The app frames this page per
     formula (markdown.contract MathBlock) with the TeX, the theme and the text size in the fragment. -->
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./vendor/katex.min.css">
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      /* The chat's prose colour (markdown.contract AnswerMarkdown). */
      body { color: #18181be6; text-align: center; }
      [data-theme="dark"] body { color: #f5f5f5e6; }
      /* MarkdownMath's scroll span (px-0.5 py-0.75) around a box as wide as the formula, centred in the lane. */
      #host { display: inline-block; width: max-content; padding: 3px 2px; text-align: initial; }
      /* index.css .chat-markdown-math-display .katex-display */
      .katex-display { margin: 0; }
    </style>
    <script type="module" src="./render.js"></script>
  </head>
  <body><div id="host"></div></body>
</html>
