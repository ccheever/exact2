<!doctype html>
<!-- One Mermaid fence, rendered as T3 Code's MermaidDiagram renders it (render.js). The app frames this page per fence
     (markdown.contract MermaidBlock) with the fence's source, theme and font in the fragment. -->
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #host svg { display: block; width: 100%; height: auto; max-width: none; }
    </style>
    <script type="module" src="./render.js"></script>
  </head>
  <body><div id="host"></div></body>
</html>
