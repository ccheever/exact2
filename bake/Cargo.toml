# Delivery baking: the compatibility id and the embedded receipt, checked
# against publisher receipts. App build scripts depend on
# it; the compiler does not.
[package]
name = "exact-bake"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Delivery baking: the compatibility id and the embedded receipt"
publish = false

[lib]
name = "exact_bake"

[[bin]]
name = "exact-bake"
path = "src/main.rs"

[dependencies]
contract = { path = "../contract/cli" }
contract-syntax = { path = "../contract/syntax" }
exact-color = { path = "../color" }
exact-kernel = { path = "../kernel" }
exact-plan = { path = "../plan" }
exact-runner = { path = "../runner" }
# The app's SVG images, read for the island module a fixed build carries.
exact-svg-file = { path = "../host/svg-file" }
serde_json = "1.0"
sha2 = "0.10"
# The shaders' interface digests for the compatibility id.
exact-gpu-reflect = { path = "../gpu/reflect" }
# The build validates publisher receipt signatures using the client parser.
exact-update = { path = "../update" }

# The same owned-directory gate as the copy/publish helper, on build hosts only.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
exact-filesystem = { path = "../filesystem" }
