[workspace]
members = ["apps/exact-live/data", "apps/exact-live/web", "apps/exact-live/apple", "apps/exact-live/linux", "apps/interaction-gallery/data", "apps/interaction-gallery/web", "apps/interaction-gallery/apple", "apps/interaction-gallery/linux", "apps/markdown-stress/data", "apps/markdown-stress/web", "apps/markdown-stress/apple", "apps/markdown-stress/linux", "apps/messages-stress/linux", "apps/completion-storm/apple", "apps/completion-storm/linux", "apps/messages-stress/data", "apps/messages-stress/web", "apps/messages-stress/apple", "apps/completion-storm/data", "apps/completion-storm/web", "data/host", "apps/fieldnotes/data", "data", "apps/update-lab/logic", "logic/bake", "apps/caltrain/logic", "logic", "logic/abi", "apps/update-lab/data", "apps/update-lab/web", "apps/update-lab/apple", "snapback4", "apps/messages/linux", "kernel", "motion", "route", "plan", "runner", "contract/syntax", "contract/types", "contract/analyze", "contract/lower", "contract/cli", "apps/caltrain", "apps/caltrain/data", "host/web", "apps/caltrain/web", "host/apple", "host/raster", "host/apple-update", "apps/caltrain/apple", "host/linux", "host/linux-update", "apps/caltrain/linux", "gpu", "gpu/reflect", "apps/caltrain/gpu", "js", "js/bake", "js/value", "js/web", "update", "filesystem", "apps/fieldnotes/web", "apps/fieldnotes/apple", "apps/markdown/parse", "apps/markdown/data", "apps/markdown/apple", "apps/markdown/web", "apps/llp/data", "apps/llp/apple", "apps/llp/web", "apps/weatherlight/web", "apps/weatherlight/apple", "apps/weatherlight/gpu", "apps/messages/apple", "apps/messages/web"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Taffy 0.9.2 plus five Exact patches. The inventory and update checklist live
# in vendor/taffy/EXACT-PATCHES.md.
[patch.crates-io]
taffy = { path = "vendor/taffy" }
# Pinned 0.19.0, font admission and span reservation fixes; see vendor/cosmic-text/EXACT-PATCHES.md.
cosmic-text = { path = "vendor/cosmic-text" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The wasm shipped to browsers: size over speed (the runner's work is sub-millisecond;
# every byte is fetch, parse, and compile). `host/web/build.mjs` builds with this and
# runs `wasm-opt -Oz` on top when binaryen is installed.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dev]
opt-level = 0
debug = true

# Fast independent business-logic links in the resident development loop.
[profile.logic-dev]
inherits = "dev"
opt-level = 1
debug = false
incremental = true
panic = "abort"
