# The blocking gate (rules/RULES.md): deterministic, in-process crates. Hosts,
# GPU, Hermes, platform shells and stress fixtures run in the async lane,
# which adds `--workspace` to the same commands. The web host is here (Charlie,
# 2026-10-05): warm, its tests add about 5 s at load ~30 (20–35 s under heavy
# load); its Bun-launching test is the async lane's. So is the Apple host's Rust
# (Charlie, 2026-10-06), its real-socket, wall-clock and toolchain-launching
# (Bun, Swift, nested cargo) tests the async lane's.
default-members = [
    "host/web",
    "host/apple",
    "examples/calendar/data",
    "grants",
    "kernel", "motion", "num", "svg-filter", "plan", "runner", "route",
    "contract/syntax", "contract/types", "contract/analyze", "contract/lower", "contract/cli", "bake",
    "markdown", "markdown/editor", "textflow", "update", "data", "logic", "logic/abi",
    "filesystem", "host/raster", "host/web-js/motion", "host/svg-raster", "js/value", "canvas", "color",
    "apps/caltrain", "apps/caltrain/data", "apps/completion-storm/data", "apps/exact-live/data",
    "apps/fieldnotes/data", "apps/interaction-gallery/data", "apps/llp/data", "apps/markdown/data",
    "apps/markdown/parse", "apps/markdown-stress/data", "apps/textflow/data", "apps/typetour/data",
    "apps/update-lab/data", "apps/video-player/data", "apps/sparkline/data", "apps/svg-gallery/data", "apps/carousel/data", "apps/motion-gallery/data", "apps/spark/data",
    "apps/shared-elements/data",
]
# Vendored path dependencies are built, not linted or tested here.
exclude = ["vendor", "snapback4", "apps/messages-legacy"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Taffy 0.14.0 plus Exact patches. The inventory and update checklist live
# in vendor/taffy/EXACT-PATCHES.md.
[patch.crates-io]
taffy = { path = "vendor/taffy" }
# Pinned 0.19.0, font admission and span reservation fixes; see vendor/cosmic-text/EXACT-PATCHES.md.
cosmic-text = { path = "vendor/cosmic-text" }
# wgpu-hal 30.0.1 with two Metal patches (no empty command buffers; a frame's
# presentations on its submit); see vendor/wgpu-hal/EXACT-PATCHES.md. exact-gpu's
# build script refuses a workspace without this line.
wgpu-hal = { path = "vendor/wgpu-hal" }

# A production bake for an Apple target says `lto = "fat"` on Cargo's command
# line (`buildBake`, scripts/app.mjs): 4.8% less binary for 16 s of that build.
# Not here, because every developer tool builds at `release` too.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Build scripts and proc macros load as dylibs. With MACOSX_DEPLOYMENT_TARGET
# set (host/apple/build.mjs sets 14.0), Xcode 27's strip leaves them
# unloadable ("mis-aligned LINKEDIT string pool"). Nothing of theirs ships.
[profile.release.build-override]
strip = false

# The wasm shipped to browsers: size over speed (the runner's work is sub-millisecond;
# every byte is fetch, parse, and compile). `host/web/build.mjs` builds with this and
# runs `wasm-opt -Oz` on top when binaryen is installed.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dev]
opt-level = 0
debug = true

# Keep the CPU rasterizer's per-pixel loops fast during development and tests.
[profile.dev.package.tiny-skia]
opt-level = 3

# Keep PNG screenshot and image byte loops fast in the same development loop.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

# Keep font discovery and parsing fast for headless development and tests.
[profile.dev.package.fontdb]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3

# The tooling filesystem helper carries every dev generation's bytes as
# base64 JSON; unoptimized, decoding a megabyte is most of an edit's latency.
[profile.dev.package.exact-filesystem]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3

# Development native builds — an Apple app (`host/apple/build.mjs` unless the
# trust is production), the Linux host an agent drives (`cargo build --profile
# host-dev -p caltrain-linux`) and an app's render entry at build time:
# release's optimizations without whole-graph LTO, so touching one line of a
# host rebuilds in seconds. Through build.mjs that was 20 s at load 650,
# against 57–228 s; the Linux host on a Ryzen 3600 rebuilds a touched kernel in
# 3.4 s, against 102 s at `release`, whose one codegen unit compiles the kernel
# in 58 s on one core before a 36 s LTO link. Startup is ~5% slower and the
# binary ~1 MB larger than release (Charlie, 2026-09-24); what ships is baked
# at `release`. `lto = "off"`, which also drops the thin LTO rustc runs inside
# each crate, was measured (an M4, 2026-10-04) and not taken: a cold build's
# Rust is 21% less CPU and a rebuild no faster, while the runner's boot work is
# 13% slower and the executable 3 MB larger.
[profile.host-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
# Every dylib of a development build was already built unstripped (Xcode 27's
# strip, above), each by an override that made its dependencies separate
# units. Said once here, the archive, the GPU crate and the host's two
# on-demand modules are one profile, and Cargo compiles what they share once.
strip = false
[profile.host-dev.build-override]
strip = false

# Fast independent business-logic links in the resident development loop.
[profile.logic-dev]
inherits = "dev"
opt-level = 1
debug = false
incremental = true
panic = "abort"

# Fast surface module rebuilds; dependencies stay optimized, the game links cheaply.
[profile.gpu-dev]
inherits = "dev"
opt-level = 1
debug = false
strip = "debuginfo"
panic = "abort"
lto = false
incremental = true

[profile.gpu-dev.package."*"]
opt-level = 3

# The wildcard excludes workspace members; this runtime is one in the root.
[profile.gpu-dev.package.exact-gpu]
opt-level = 3
