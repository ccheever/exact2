[workspace]
members = ["kernel", "motion", "plan", "runner", "contract/syntax", "contract/types", "contract/analyze", "contract/lower", "contract/cli", "apps/caltrain", "apps/caltrain/data", "host/web", "apps/caltrain/web", "host/apple", "host/apple-update", "apps/caltrain/apple", "host/linux", "host/linux-update", "apps/caltrain/linux", "gpu", "gpu/reflect", "apps/caltrain/gpu", "js", "js/bake", "js/value", "js/web", "update", "filesystem", "apps/fieldnotes/web", "apps/fieldnotes/apple", "apps/markdown/parse", "apps/markdown/data", "apps/markdown/apple", "apps/markdown/web", "apps/llp/data", "apps/llp/apple", "apps/llp/web", "apps/weatherlight/web", "apps/weatherlight/apple", "apps/weatherlight/gpu"]
resolver = "2"

[workspace.dependencies]
ibex2 = { git = "https://github.com/expo/ibex.git", rev = "f68cfb082d0a5ea927497715069f830ecdac2a10", default-features = false }
ibex2-sqlite = { git = "https://github.com/expo/ibex.git", rev = "f68cfb082d0a5ea927497715069f830ecdac2a10" }

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Taffy 0.9.2 plus five Exact patches. The inventory and update checklist live
# in vendor/taffy/EXACT-PATCHES.md.
[patch.crates-io]
taffy = { path = "vendor/taffy" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The wasm shipped to browsers: size over speed (the runner's work is sub-millisecond;
# every byte is fetch, parse, and compile). `host/web/build.mjs` builds with this and
# runs `wasm-opt -Oz` on top when binaryen is installed.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dev]
opt-level = 0
debug = true
