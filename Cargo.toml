[workspace]
members = ["apps/video-player/data", "apps/video-player/apple", "apps/video-player/web", "data/host", "apps/fieldnotes/data", "data", "apps/update-lab/logic", "logic/bake", "apps/caltrain/logic", "logic", "logic/abi", "apps/update-lab/data", "apps/update-lab/web", "apps/update-lab/apple", "snapback4", "apps/messages/linux", "kernel", "motion", "plan", "runner", "contract/syntax", "contract/types", "contract/analyze", "contract/lower", "contract/cli", "apps/caltrain", "apps/caltrain/data", "host/web", "apps/caltrain/web", "host/apple", "host/apple-update", "apps/caltrain/apple", "host/linux", "host/linux-update", "apps/caltrain/linux", "gpu", "gpu/reflect", "apps/caltrain/gpu", "js", "js/bake", "js/value", "js/web", "update", "filesystem", "apps/fieldnotes/web", "apps/fieldnotes/apple", "apps/markdown/parse", "apps/markdown/data", "apps/markdown/apple", "apps/markdown/web", "apps/llp/data", "apps/llp/apple", "apps/llp/web", "apps/weatherlight/web", "apps/weatherlight/apple", "apps/weatherlight/gpu", "apps/messages/apple", "apps/messages/web", "apps/typetour/data", "apps/typetour/apple", "apps/typetour/web", "apps/interaction-gallery/data", "apps/interaction-gallery/web", "apps/interaction-gallery/apple", "apps/interaction-gallery/linux", "apps/markdown-stress/data", "apps/markdown-stress/web", "apps/markdown-stress/apple", "apps/markdown-stress/linux", "apps/messages-stress/linux", "apps/completion-storm/apple", "apps/completion-storm/linux", "apps/messages-stress/data", "apps/messages-stress/web", "apps/messages-stress/apple", "apps/completion-storm/data", "apps/completion-storm/web", "route", "host/raster", "apps/exact-live/data", "apps/exact-live/web", "apps/exact-live/apple", "apps/exact-live/linux", "apps/textflow/data", "apps/textflow/web", "apps/textflow/apple", "apps/textflow/linux", "textflow", "apps/reflow/data", "apps/reflow/web", "apps/reflow/apple", "apps/reflow/linux"]
resolver = "2"

# Snapback4 0.2.30 release source: a397218e2332964ebe29aa1d30918c436713cc8a.
# Match the published CLI and browser device, without a mutable sibling checkout.
[workspace.dependencies]
snapback4-core = { git = "https://github.com/expo/snapback.git", rev = "a397218e2332964ebe29aa1d30918c436713cc8a", version = "=0.2.30" }
snapback4-device = { git = "https://github.com/expo/snapback.git", rev = "a397218e2332964ebe29aa1d30918c436713cc8a", version = "=0.2.30" }
snapback4-lang = { git = "https://github.com/expo/snapback.git", rev = "a397218e2332964ebe29aa1d30918c436713cc8a", version = "=0.2.30" }

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Taffy 0.14.0 plus Exact patches. The inventory and update checklist live
# in vendor/taffy/EXACT-PATCHES.md.
[patch.crates-io]
taffy = { path = "vendor/taffy" }
# Pinned 0.19.0, font admission and span reservation fixes; see vendor/cosmic-text/EXACT-PATCHES.md.
cosmic-text = { path = "vendor/cosmic-text" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The wasm shipped to browsers: size over speed (the runner's work is sub-millisecond;
# every byte is fetch, parse, and compile). `host/web/build.mjs` builds with this and
# runs `wasm-opt -Oz` on top when binaryen is installed.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dev]
opt-level = 0
debug = true

# Keep the CPU rasterizer's per-pixel loops fast during development and tests.
[profile.dev.package.tiny-skia]
opt-level = 3

# Keep PNG screenshot and image byte loops fast in the same development loop.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

# Keep font discovery and parsing fast for headless development and tests.
[profile.dev.package.fontdb]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3

# Fast independent business-logic links in the resident development loop.
[profile.logic-dev]
inherits = "dev"
opt-level = 1
debug = false
incremental = true
panic = "abort"
