# Pure grant grammar shared by native bindings, the runner and app bakes.
[package]
name = "exact-grants"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
url = "2.5"

[dev-dependencies]
# Native adoption checks the browser grammar against Ibex's independent grammar.
ibex2 = { path = "../vendor/ibex/crates/ibex2", default-features = false }
