# The Snapback4 client resolves its private sources here, outside exact2's
# root lock. Apps depend on this crate by path.
[workspace]
members = ["client", "web"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Snapback4 0.4.16 release source: 468d3aa5be3eee914883e37f3ab0424030ac882d.
# Match the published CLI and browser device, without a mutable sibling checkout.
[workspace.dependencies]
snapback4-core = { git = "https://github.com/expo/snapback.git", rev = "468d3aa5be3eee914883e37f3ab0424030ac882d", version = "=0.4.16", default-features = false }
snapback4-device = { git = "https://github.com/expo/snapback.git", rev = "468d3aa5be3eee914883e37f3ab0424030ac882d", version = "=0.4.16", default-features = false }
snapback4-lang = { git = "https://github.com/expo/snapback.git", rev = "468d3aa5be3eee914883e37f3ab0424030ac882d", version = "=0.4.16" }

[patch.crates-io]
taffy = { path = "../vendor/taffy" }
parley = { path = "../vendor/parley" }
fontique = { path = "../vendor/fontique" }
wgpu-hal = { path = "../vendor/wgpu-hal" }

[package]
name = "exact-snapback4"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "App-scoped Snapback4 native device, behind Exact's data seam."

[dependencies]
exact-plan = { path = "../plan" }
exact-runner = { path = "../runner" }
ibex2 = { path = "../vendor/ibex/crates/ibex2", default-features = false }
exact-snapback4-client = { path = "client" }
serde_json = "1"
snapback4-device = { workspace = true, features = ["native"] }

[dev-dependencies]
snapback4-core = { workspace = true, features = ["sqlite", "native", "server-search"] }
snapback4-lang.workspace = true

# The web's wasm (web/build.mjs): size first, as Snapback builds its own.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
strip = true
