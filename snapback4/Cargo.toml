[package]
name = "exact-snapback4"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "App-scoped Snapback4 native device, behind Exact's data seam."

[dependencies]
exact-plan = { path = "../plan" }
exact-runner = { path = "../runner" }
ibex2 = { path = "../../ibex/crates/ibex2", default-features = false }
serde_json = "1"
snapback4-device = { path = "../../snapback-sb4/snapback4/crates/snapback4-device" }

[dev-dependencies]
snapback4-core = { path = "../../snapback-sb4/snapback4/crates/snapback4-core" }
snapback4-lang = { path = "../../snapback-sb4/snapback4/crates/snapback4-lang" }
